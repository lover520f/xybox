name: xybox
description: XYBox - Flutter 视频播放器，1:1 复刻 FongMi/TV 项目
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # 路由
  go_router: ^12.1.1
  
  # 网络
  dio: ^5.3.3
  http: ^1.1.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  
  # 数据库
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.15
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # 播放器
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.0.2
  
  # JS 引擎
  flutter_js: ^0.8.0
  
  # 代码生成
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # 依赖注入
  get_it: ^7.6.4
  
  # 工具
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  convert: ^3.1.1
  screen_brightness: ^0.2.2+1
  volume_controller: ^2.0.7
  wakelock: ^0.6.2
  uri_to_file: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  drift_dev: ^2.13.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/configs/
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/custom_icons.ttf
