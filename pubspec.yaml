name: xybox
description: "XYBox - 1:1 复刻 FongMi/TV 项目"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # 路由
  go_router: ^13.0.0
  
  # 网络
  dio: ^5.4.0
  
  # 数据库
  drift: ^2.15.0
  
  # 依赖注入
  get_it: ^7.6.4
  
  # 代码生成
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # 播放器
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.0.2
  
  # 屏幕常亮
  wakelock_plus: ^1.1.3
  
  # 本地存储
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # 图片
  cached_network_image: ^3.3.1
  
  # 本地服务器
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  
  # JavaScript 引擎
  flutter_js: ^0.8.0
  
  # DLNA
  dlna_dart: ^0.0.5
  
  # 加密
  crypto: ^3.0.3
  
  # Android 原生
  fluttertoast: ^8.2.4
  permission_handler: ^11.3.0
  url_launcher: ^6.2.4
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.15.0
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/configs/
    - assets/images/
    - assets/fonts/
